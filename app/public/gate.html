<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TymbleTime Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'%3E%3Cpath d='M32 20C22 6 6 2 4 10s2 22 10 24 14-6 18-14z' fill='%23ff3d9a' stroke='%23000' stroke-width='3'/%3E%3Cpath d='M32 20C42 6 58 2 60 10s-2 22-10 24-14-6-18-14z' fill='%23ff3d9a' stroke='%23000' stroke-width='3'/%3E%3Ccircle cx='32' cy='20' r='7' fill='%23ff85c0' stroke='%23000' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root { --pink: #ff3d9a; --pink-soft: #ff85c0; --ink: #0b0b0d; --ink-2: #17151a; --text: #fff5fa; --muted: #d9b8c9; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background-color: var(--ink);
    background-image: radial-gradient(rgba(255, 61, 154, .16) 2.5px, transparent 3px);
    background-size: 28px 28px;
    color: var(--text); font-family: "Fredoka", ui-rounded, system-ui, sans-serif;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center; background: var(--ink-2);
    border: 3px solid var(--pink); border-radius: 28px; padding: 36px 24px 28px; box-shadow: 8px 8px 0 var(--pink);
  }
  .bow { width: 110px; height: 70px; margin: -8px auto 8px; display: block; animation: wiggle 3s ease-in-out infinite; }
  h1 { font-size: 30px; margin: 0; }
  h1 span { color: var(--pink); }
  p { color: var(--muted); margin: 6px 0 22px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    font: inherit; font-size: 18px; text-align: center; padding: 14px 16px; border-radius: 999px;
    border: 3px solid var(--pink-soft); background: var(--ink); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255, 61, 154, .3); }
  button {
    font: inherit; font-size: 18px; font-weight: 600; padding: 14px; cursor: pointer; border-radius: 999px;
    border: 3px solid #000; background: var(--pink); color: var(--ink); box-shadow: 4px 4px 0 var(--pink-soft);
  }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--pink-soft); }
  .err { color: var(--pink-soft); margin: 0 0 14px; font-size: 15px; }
  @keyframes wiggle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { .bow { animation: none; } }
</style>
</head>
<body>
<main class="card">
  <svg class="bow" viewBox="0 0 64 40" aria-hidden="true">
    <path d="M32 20C22 6 6 2 4 10s2 22 10 24 14-6 18-14z" fill="#ff3d9a" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M32 20C42 6 58 2 60 10s-2 22-10 24-14-6-18-14z" fill="#ff3d9a" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12 14c3 1 6 4 8 7M52 14c-3 1-6 4-8 7" stroke="#ff85c0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="20" r="7" fill="#ff85c0" stroke="#000" stroke-width="3"/>
  </svg>
  <h1>Tymble<span>Time</span></h1>
  <p>Your gymnastics coach in your pocket ✨</p>
  <!--MSG-->
  <form method="POST" action="/login">
    <input name="password" type="password" placeholder="Secret password" aria-label="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Let's go! 🎀</button>
  </form>
</main>
</body>
</html>
